server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: uma URL como /comparacoes não existe como arquivo —
    # sem isso, dar F5 numa rota que não seja "/" retorna 404 do nginx em
    # vez de deixar o React Router decidir o que mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome (JS/CSS gerados pelo build) podem ser
    # cacheados por bem mais tempo — o hash muda sozinho quando o
    # conteúdo muda, então cache antigo nunca fica "preso".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}